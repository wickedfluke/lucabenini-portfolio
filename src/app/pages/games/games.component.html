<section class="view">
  <p class="eyebrow">Unauthorized Subroutines // Recreational Protocols</p>
  <h1 class="page-title glitch" data-text="Arcade">Arcade</h1>
  <p class="page-lede">
    These modules serve no operational function.
  </p>

  <div class="grid">
    <app-frame label="Mainframe Access" index="G-01" class="span-4">
      <app-matrix-terminal></app-matrix-terminal>
    </app-frame>

    <app-frame label="Runner Protocol" index="G-02" class="span-4">
      <app-dino-game></app-dino-game>
    </app-frame>

    <app-frame label="?" index="G-03" class="span-4">

      <div class="konami-input-row">
        <input
          #konamiField
          type="text"
          class="konami-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="..."
          aria-label="Sequence input"
          (keydown.enter)="checkCode(konamiField.value)"
        />
        <button type="button" class="l13-btn" (click)="checkCode(konamiField.value)">Submit</button>
      </div>

      @if (codeFeedback) {
        <p class="konami-feedback" [class.is-ok]="codeAccepted">{{ codeFeedback }}</p>
      }
    </app-frame>
  </div>
</section>
