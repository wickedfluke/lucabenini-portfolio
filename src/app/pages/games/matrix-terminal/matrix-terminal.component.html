<div class="matrix-shell">
  <canvas #rainCanvas class="rain" aria-hidden="true"></canvas>

  <div class="term">
    <div class="term-log" #logEl>
      @for (line of log; track $index) {
        <p class="term-line" [class.is-input]="line.type === 'input'">
          @if (line.type === 'input') {
            <span class="prompt">guest:~$</span> {{ line.text }}
          } @else {
            {{ line.text }}
          }
        </p>
      }
    </div>

    <div class="term-input-row">
      <span class="prompt">guest:~$</span>
      <input
        #cmdInput
        type="text"
        class="term-input"
        autocomplete="off"
        spellcheck="false"
        aria-label="Matrix terminal command input"
        (keydown.enter)="runCommand(cmdInput.value); cmdInput.value = ''"
      />
    </div>
  </div>
</div>
